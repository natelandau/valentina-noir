---
name: "Create Release"

# Railway deploys production from the `production` branch. After the tests pass and the
# GitHub release exists, this workflow moves that branch to the tagged commit. Only a
# version tag or the rollback workflow moves production.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g., v0.2.0)"
                required: true
                type: string
    push:
        # Final versions only; a prerelease tag such as v1.2.0rc1 never reaches production
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: read

env:
    TAG: ${{ inputs.tag || github.ref_name }}

jobs:
    run-tests:
        uses: ./.github/workflows/reusable-tests.yml
        secrets: inherit
        with:
            ref: ${{ inputs.tag || github.ref }}

    autorelease:
        name: Create Release
        runs-on: "ubuntu-latest"
        needs: run-tests
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.TAG }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Python, uv, and the package
              uses: ./.github/actions/setup_python_env
              with:
                  python-version: "3.13"

            - name: Add version to environment vars
              run: |
                  PROJECT_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
                  echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

            - name: Check if tag version matches project version
              shell: bash
              run: |
                  if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
                      echo "::error::Tag $TAG does not exist"
                      exit 1
                  fi

                  echo "$TAG"
                  echo "$PROJECT_VERSION"
                  if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then
                      echo "::error::Tag $TAG does not match project version v$PROJECT_VERSION"
                      exit 1
                  fi

            # DEPRECATED: We do not offer valentina-noir as a package
            # - name: Build the package
            #   shell: bash
            #   run: uv build

            # DEPRECATED: This release notes generation is no longer used
            # - name: Release Notes
            #   run: git log $(git describe HEAD~ --tags --abbrev=0)..HEAD --pretty='format:* %h %s' --no-merges >> ".github/RELEASE-TEMPLATE.md"

            # Extract the tag's section from CHANGELOG.md in-repo, so no third-party code
            # runs in a job that holds a contents: write token.
            - name: Get notes
              shell: bash
              run: |
                  awk -v heading="## $TAG " '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
                  if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
                      echo "::error::CHANGELOG.md has no section for $TAG"
                      exit 1
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ env.TAG }}
                  body_path: ${{ runner.temp }}/release-notes.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-container:
        needs: run-tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: ghcr.io
            IMAGE_NAME: ${{ github.repository }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.TAG }}
                  persist-credentials: false

            # Tags come from the TAG value rather than the event ref, so a manual run
            # started from a branch still tags the image with the release version.
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # Only a tag push moves `latest`; a manual run may rebuild an older tag
                  flavor: latest=${{ github.event_name == 'push' }}
                  tags: |
                      type=raw,value=${{ env.TAG }}
                      type=semver,pattern={{version}},value=${{ env.TAG }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
                      type=semver,pattern={{major}},value=${{ env.TAG }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to the Container registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=Valentina Noir API

    # Production builds from source, so this does not wait on the GHCR image.
    promote:
        name: Move the production branch to the tag
        needs: [run-tests, autorelease]
        runs-on: ubuntu-latest
        # Only this job joins the group shared with the rollback workflow, so a queued
        # promotion never cancels another run's release or image. GitHub keeps only the
        # newest pending job in a group, so the guard below, not the queue, keeps
        # production from moving to an older tag.
        concurrency:
            group: production-promotion
            cancel-in-progress: false
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.TAG }}
                  fetch-depth: 0

            # Accepts only a final vX.Y.Z tag, because `sort -V` ranks a prerelease such as
            # 1.2.0rc1 above 1.2.0. Refuses to move production backward, so a slow run for an
            # older tag never overtakes a newer release. The rollback workflow is the only
            # backward path.
            - name: Move production to the tag
              shell: bash
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::$TAG is not a final version tag (vX.Y.Z)"
                      exit 1
                  fi
                  git fetch --force --tags origin
                  current=""
                  # Exit code 2 means the branch does not exist yet; anything else nonzero is a real failure.
                  found=0
                  git ls-remote --exit-code --heads origin production >/dev/null || found=$?
                  if [[ "$found" == 0 ]]; then
                      git fetch --force origin "+refs/heads/production:refs/remotes/origin/production"
                      current=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*[!0-9.]*' origin/production 2>/dev/null || true)
                  elif [[ "$found" != 2 ]]; then
                      echo "::error::Could not read the production branch from origin"
                      exit 1
                  fi

                  if [[ -n "$current" ]]; then
                      newest=$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sort -V | tail -n 1)
                      if [[ "${TAG#v}" == "${current#v}" || "$newest" != "${TAG#v}" ]]; then
                          echo "::notice::production is at $current, which is not older than $TAG. Leaving it in place."
                          exit 0
                      fi
                  fi

                  git push --force origin "refs/tags/$TAG^{commit}:refs/heads/production"
