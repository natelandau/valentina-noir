# Railway builds and deploys the `production` branch with these settings. The release
# workflow moves that branch to each version tag. Only a version tag or the rollback
# workflow moves production.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# `app migrate` also seeds reference data. A failure here stops the deploy and the
# running container keeps serving.
preDeployCommand = ["app migrate"]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
